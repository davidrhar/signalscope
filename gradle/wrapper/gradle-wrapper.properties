distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
# Published by Gradle at services.gradle.org/distributions/gradle-8.13-bin.zip.sha256.
# Without this the wrapper runs whatever the URL serves, and the first thing a clone of a public
# repository does is download and execute that. Pinning the hash makes a substituted distribution
# a build failure rather than arbitrary code execution on a contributor's machine.
distributionSha256Sum=20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
